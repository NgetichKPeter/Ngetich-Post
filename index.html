<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngetich Post - Live Database Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Chivo', sans-serif; overflow-x: hidden; }

        header { background-color: #121212; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2d2d2d; padding: 12px 16px; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; text-decoration: none; color: white; }

        .nav-sub { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 10px 16px; border-bottom: 1px solid #2d2d2d; font-size: 14px; }
        .nav-sub a { color: #aaaaaa; text-decoration: none; }
        .nav-sub a.ai-option { color: #116efc; font-weight: 700; }

        main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
        
        /* Premium Responsive Table Styling */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            background-color: #1a1a1a;
        }

        .news-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
            min-width: 700px; 
        }

        .news-table th {
            background-color: #242424;
            color: #116efc;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 14px 16px;
            border-bottom: 2px solid #2d2d2d;
        }

        .news-table td {
            padding: 16px;
            border-bottom: 1px solid #2d2d2d;
            vertical-align: middle;
            line-height: 1.4;
        }

        .news-table tr:nth-child(even) {
            background-color: #151515;
        }

        .news-table tr:hover {
            background-color: #1f1f1f;
            transition: background-color 0.2s ease;
        }

        /* Database Media Previews */
        .table-thumb {
            width: 70px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #121212;
            display: block;
        }

        .table-badge {
            background-color: rgba(17, 110, 252, 0.15);
            color: #116efc;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }

        .loading-status { text-align: center; color: #666; font-size: 14px; padding: 40px 0; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <div class="nav-top">
            <a href="#" class="logo">The Ngetich Post</a>
        </div>
    </header>

    <div class="nav-sub">
        <a href="#" class="active">Database Dashboard</a>
        <a class="ai-option">Ngetich AI Active</a>
    </div>

    <main>
        <div class="table-container">
            <table class="news-table">
                <thead>
                    <tr>
                        <th>Media</th>
                        <th>Category</th>
                        <th>Headline</th>
                        <th>Summary / Content Preview</th>
                    </tr>
                </thead>
                <tbody id="liveNewsTableBody">
                    <tr>
                        <td colspan="4" class="loading-status" id="loadingText">
                            Connecting to cloud sheet database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Connected to your live Google Spreadsheet Database:
        const SPREADSHEET_ID = "1MN61ccbioOtrzAYsIqmAKFo_pdXizwqd-l0h1JGCLiQ";
        
        // Google Visualization API Target Link
        const JSON_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        window.onload = function() {
            loadTableFromSheets();
        };

        function loadTableFromSheets() {
            fetch(JSON_URL)
                .then(response => response.text())
                .then(data => {
                    // Extract clean JSON from Google wrapper
                    const pureJson = JSON.parse(data.substr(47).slice(0, -2));
                    const rows = pureJson.table.rows;
                    const tableBody = document.getElementById('liveNewsTableBody');
                    
                    if (!rows || rows.length === 0) {
                        tableBody.innerHTML = "<tr><td colspan='4' class='loading-status'>No database rows found.</td></tr>";
                        return;
                    }

                    // Reset table contents
                    tableBody.innerHTML = "";

                    // Read backward loop (Newest rows appear first)
                    for (let i = rows.length - 1; i >= 0; i--) {
                        const cells = rows[i].c;
                        
                        // Parse safely out of Google data architecture
                        const category = cells[0] ? cells[0].v : "General";
                        const title = cells[1] ? cells[1].v : "";
                        const sub = cells[2] ? cells[2].v : "";
                        const mediaUrl = cells[3] ? cells[3].v : "";

                        if(!title || title === "title") continue; // Ignore empty rows or header clones

                        // Smart media handler for thumbnails
                        let mediaElement = `<span style="color:#444; font-size:11px;">No Media</span>`;
                        if(mediaUrl && !mediaUrl.startsWith('(')) {
                            if(mediaUrl.toLowerCase().endsWith('.mp4') || mediaUrl.includes('video')) {
                                mediaElement = `<video src="${mediaUrl}" class="table-thumb" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>`;
                            } else {
                                mediaElement = `<img src="${mediaUrl}" class="table-thumb" alt="Preview">`;
                            }
                        }

                        // Generate Table Row HTML template literal
                        const rowHtml = `
                            <tr>
                                <td>${mediaElement}</td>
                                <td><span class="table-badge">${category}</span></td>
                                <td style="font-family: 'Lora', serif; font-weight: 700; font-size: 16px; color: #ffffff;">${title}</td>
                                <td style="color: #aaaaaa; font-size: 13px;">${sub}</td>
                            </tr>
                        `;
                        
                        tableBody.innerHTML += rowHtml;
                    }
                })
                .catch(error => {
                    console.error("Database connection failure:", error);
                    const loadingText = document.getElementById('loadingText');
                    if(loadingText) {
                        loadingText.innerText = "Database connection offline. Verify your Spreadsheet Share settings to 'Anyone with link'.";
                    }
                });
        }
    </script>
</body>
</html>
