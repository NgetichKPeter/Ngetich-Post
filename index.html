<!-- ── NATIVE CORE JAVASCRIPT SYSTEM ENGINE (NGETICH AI INITIAL ACTIVE MODE) ── -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  
  // 1. DATA DICTIONARY FOR EVERY STORY (Your Content Library)
  const storiesDataset = [
    {
      id: "story-1",
      category: "politics",
      headline: "Ngetich sweeps Senate runoff in a landmark victory for grassroots Kenya",
      deck: "John Ngetich became the first independent senator to win in the region in over three decades. A groundswell of community support propelled the former teacher to a victory over his nearest rival.",
      byline: "By Staff Reporter • May 28, 2026",
      isLead: true
    },
    {
      id: "story-2",
      category: "world",
      headline: "East Africa summit ends with historic climate finance deal",
      deck: "Leaders from seven nations agreed on a $3bn fund to restore degraded land across the region.",
      byline: "By Amina Waweru • May 28, 2026",
      isSide: true
    },
    {
      id: "story-3",
      category: "tech",
      headline: "Silicon Savannah's new hub targets deep tech and AI localization",
      deck: "A new tech corridor launched outside Nairobi aims to decentralize engineering talent across East Africa.",
      byline: "By David Mwangi • May 28, 2026",
      isSide: true
    },
    {
      id: "story-4",
      category: "climate",
      headline: "Rift Valley water levels hit historic markers down baseline",
      deck: "New ecological patterns trace complex transformations altering local agricultural output models.",
      byline: "By Solar Editorial Team"
    },
    {
      id: "story-5",
      category: "kenya",
      headline: "Logistics expansions clear bottlenecks across transit systems",
      deck: "Municipal infrastructure overhauls set records optimizing regional supply chain velocities.",
      byline: "By Trade Desk"
    }
  ];

  // 2. CORE VIEW & FILTER ROUTER
  const tabTriggers = document.querySelectorAll(".tab-trigger");
  const tabContents = document.querySelectorAll(".tab-content");
  const navButtons = document.querySelectorAll(".nav-btn");
  const heroGrid = document.querySelector(".hero-grid");
  const aiInput = document.getElementById("ai-input-field");
  const aiOutput = document.getElementById("ai-output-response");

  function filterSection(category) {
    navButtons.forEach(btn => btn.classList.remove("active"));
    tabTriggers.forEach(tab => tab.classList.remove("active"));
    tabContents.forEach(content => content.classList.remove("active-view"));
    
    document.getElementById("top-stories-view").classList.add("active-view");

    const matchingNav = Array.from(navButtons).find(btn => btn.textContent.toLowerCase() === category.toLowerCase());
    if (matchingNav) matchingNav.classList.add("active");

    if (category === "all") {
      const allTabsBtn = document.querySelector('[data-view="top-stories-view"]');
      if (allTabsBtn) allTabsBtn.classList.add("active");
      renderGridItems(storiesDataset);
      return;
    }

    const filteredData = storiesDataset.filter(story => story.category.toLowerCase() === category.toLowerCase());
    renderGridItems(filteredData, category);
  }

  // 3. GRAPHICS ENGINE: REBUILD THE NEWSPAPER GRID DYNAMICALLY
  function renderGridItems(stories, currentCategoryName = "All Stories") {
    if (!heroGrid) return;
    heroGrid.innerHTML = "";

    if (stories.length === 0) {
      heroGrid.innerHTML = `
        <div style="grid-column: 1/-1; padding: 40px; text-align: center; font-family: sans-serif; color: var(--mid);">
          <h3>No articles found under ${currentCategoryName}.</h3>
          <p style="font-size:14px; margin-top:8px;">Check back later for breaking updates from our Nairobi newsroom.</p>
        </div>`;
      return;
    }

    stories.forEach((story, index) => {
      const article = document.createElement("article");
      
      if (index === 0) {
        article.className = "story story-lead";
        article.innerHTML = `
          <span class="section-tag ${story.category}">${story.category}</span>
          <div class="story-img"><div class="img-placeholder">Ngetich Post Photo</div></div>
          <a href="#"><h1 class="headline">${story.headline}</h1></a>
          <p class="deck">${story.deck}</p>
          <div class="byline">${story.byline}</div>
        `;
      } else if (index === 1 || index === 2) {
        if (index === 1) {
          const wrapper = document.createElement("div");
          wrapper.className = "story-side-top";
          wrapper.id = "dynamic-side-container";
          heroGrid.appendChild(wrapper);
        }
        article.className = "story side-item";
        article.innerHTML = `
          <span class="section-tag ${story.category}">${story.category}</span>
          <div class="story-img"><div class="img-placeholder">Photo</div></div>
          <a href="#"><h2 class="headline">${story.headline}</h2></a>
          <p class="deck">${story.deck}</p>
          <div class="byline">${story.byline}</div>
        `;
        document.getElementById("dynamic-side-container").appendChild(article);
        return;
      } else {
        article.className = index === 3 ? "story story-bottom-left" : "story story-bottom-mid";
        article.innerHTML = `
          <span class="section-tag ${story.category}">${story.category}</span>
          <a href="#"><h3 class="headline">${story.headline}</h3></a>
          <p class="deck">${story.deck}</p>
          <div class="byline">${story.byline || 'By Staff Reporter'}</div>
        `;
      }
      heroGrid.appendChild(article);
    });
  }

  // 4. INTERCEPT NAVIGATION TRIGGERS
  navButtons.forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      
      const targetView = link.getAttribute("data-target");
      const categoryToFilter = link.getAttribute("data-category");

      if (targetView === "opinion-view-anchor") {
        document.getElementById("opinion-view-anchor").scrollIntoView({ behavior: "smooth" });
        navButtons.forEach(btn => btn.classList.remove("active"));
        link.classList.add("active");
        return;
      }
      
      if (targetView === "ai-view-tab" || link.classList.contains("ai-link")) {
        switchViewTabs("ai-view-tab");
        return;
      }
      
      if (targetView === "latest-view") {
        switchViewTabs("latest-view");
        navButtons.forEach(btn => btn.classList.remove("active"));
        link.classList.add("active");
        return;
      }

      if (categoryToFilter) {
        filterSection(categoryToFilter);
      }
    });
  });

  // 5. INNER WORKBENCH TAB INTERACTION SWITCHER
  function switchViewTabs(targetViewId) {
    tabContents.forEach(content => content.classList.remove("active-view"));
    tabTriggers.forEach(trigger => trigger.classList.remove("active"));

    // Set matching layout link states
    navButtons.forEach(btn => btn.classList.remove("active"));

    if (targetViewId === "ai-view-tab") {
      // Highlight AI system tab elements
      const aiTabTrigger = document.getElementById("ai-tab");
      const aiNavLink = document.querySelector(".ai-link");
      if (aiTabTrigger) aiTabTrigger.classList.add("active");
      if (aiNavLink) aiNavLink.classList.add("active");

      // Keep news background under the fold visible but focus attention on input module
      document.getElementById("top-stories-view").classList.add("active-view");
      document.getElementById("ngetich-ai").scrollIntoView({ behavior: "smooth" });
      aiInput.focus();
    } else {
      const activeContent = document.getElementById(targetViewId);
      if (activeContent) activeContent.classList.add("active-view");
      
      const activeTrigger = document.querySelector(`[data-view="${targetViewId}"]`);
      if (activeTrigger) activeTrigger.classList.add("active");
    }
  }

  tabTriggers.forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.view === "top-stories-view") {
        filterSection("all");
      } else {
        switchViewTabs(btn.dataset.view);
      }
    });
  });

  // 6. INTELLIGENT AI KNOWLEDGE GRAPH ENGINE
  const knowledgeGraph = {
    "fund": "Ngetich AI Analysis: The $3bn East Africa Climate Fund allocates roughly 40% directly toward Rift Valley forestation metrics, with 35% targeted for water-table preservation systems across cross-border hubs.",
    "climate": "Ngetich AI Analysis: The $3bn East Africa Climate Fund allocates roughly 40% directly toward Rift Valley forestation metrics, with 35% targeted for water-table preservation systems across cross-border hubs.",
    "ngetich": "Ngetich AI Analysis: Senator-elect John Ngetich's grassroots campaign secured 54.2% of the total regional runoff distributions, marking a record historic shift toward Independent Candidate mandates in regional history.",
    "senate": "Ngetich AI Analysis: Senator-elect John Ngetich's grassroots campaign secured 54.2% of the total regional runoff distributions, marking a record historic shift toward Independent Candidate mandates in regional history.",
    "savannah": "Ngetich AI Analysis: Deep Tech Corridor projections outside Nairobi anticipate adding 12,000 localized technical engineering roles within East Africa by Q4 2026.",
    "tech": "Ngetich AI Analysis: Deep Tech Corridor projections outside Nairobi anticipate adding 12,000 localized technical engineering roles within East Africa by Q4 2026."
  };

  aiInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const query = aiInput.value.toLowerCase().trim();
      if (!query) return;

      aiOutput.style.display = "block";
      aiOutput.innerText = "Analyzing live news archives...";

      setTimeout(() => {
        let match = Object.keys(knowledgeGraph).find(key => query.includes(key));
        if (match) {
          aiOutput.innerText = knowledgeGraph[match];
        } else {
          aiOutput.innerText = `Ngetich AI Data Output: Core insights for "${aiInput.value}" processed successfully. Local news feeds report active legislative metrics tracking your topic throughout East Africa.`;
        }
      }, 600);
    }
  });

  // 7. SUBSCRIPTION AND PERSISTENT REVIEWS MODULATOR
  const defaultComments = [
    { name: "Grace K.", date: "May 29, 2026", body: "Seeing an independent candidate like Ngetich take the Senate seat gives me real hope for localized governance. The focus on public school reform resonated with everyday voters.", status: "✓ Verified Subscriber" },
    { name: "Omondi_V", date: "May 29, 2026", body: "We need to watch the implementation metrics of that climate fund closely. $3 billion sounds massive, but distributed over seven partner nations over multiple fiscal years means strict management is vital.", status: "" },
    { name: "TechNomad", date: "May 28, 2026", body: "The deep tech hub initiative outside Nairobi is exactly what we need to slow down real estate inflation inside the central business district. Hope the power grid grid-balancing matches their promises!", status: "" }
  ];

  function getComments() {
    const local = localStorage.getItem("ngetich_public_comments");
    return local ? JSON.parse(local) : defaultComments;
  }

  function renderComments() {
    const listHook = document.getElementById("live-comments-hook");
    const countHeader = document.getElementById("comments-header-counter");
    const records = getComments();

    countHeader.innerText = `Discussion (${records.length})`;
    listHook.innerHTML = "";

    records.forEach(item => {
      const itemBlock = document.createElement("div");
      itemBlock.className = "comment-item";
      itemBlock.innerHTML = `
        <div class="comment-meta">
          <span class="comment-author">${escapeHtml(item.name)}</span>
          <span class="comment-date">${item.date}</span>
        </div>
        <div class="comment-body">${escapeHtml(item.body)}</div>
        ${item.status ? `<div class="comment-status">${item.status}</div>` : ''}
      `;
      listHook.appendChild(itemBlock);
    });
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  document.getElementById("comment-submission-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const nameField = document.getElementById("form-author-name");
    const bodyField = document.getElementById("form-comment-body");

    const newComment = {
      name: nameField.value.trim(),
      body: bodyField.value.trim(),
      date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
      status: "✓ Guest Voice"
    };

    const records = getComments();
    records.unshift(newComment);
    localStorage.setItem("ngetich_public_comments", JSON.stringify(records));

    nameField.value = "";
    bodyField.value = "";
    renderComments();
  });

  // UI Utilities Setup
  document.querySelectorAll(".btn-subscribe-trigger").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      alert("Subscription Engine Gateway: Premium paywall configuration mock connected successfully.");
    });
  });

  document.querySelectorAll(".trend-tag").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      aiInput.value = el.innerText;
      switchViewTabs("ai-view-tab");
    });
  });

  // ── INITIALIZATION INJECTIONS (FORCE STARTING IN AI MODE) ──
  renderComments();                  // Setup the comments layer
  renderGridItems(storiesDataset);   // Prefill newspaper background behind the fold
  
  // Force active state routing directly into AI workspace layout parameters right out of the gate
  switchViewTabs("ai-view-tab");     

  // Optional: Add a subtle placeholder system notification immediately visible when page fires up
  aiOutput.style.display = "block";
  aiOutput.innerHTML = "✦ <strong>Ngetich AI Terminal Online:</strong> System initialized. Ready to break down regional datasets, political campaign trends, or infrastructure analytics.";
});
</script>
