<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngetich Post - Live Database Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Chivo', sans-serif; overflow-x: hidden; }

        header { background-color: #121212; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2d2d2d; padding: 12px 16px; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; text-decoration: none; color: white; }

        .nav-sub { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 10px 16px; border-bottom: 1px solid #2d2d2d; font-size: 14px; }
        .nav-sub a { color: #aaaaaa; text-decoration: none; }
        .nav-sub a.ai-option { color: #116efc; font-weight: 700; }

        main { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
        
        /* News UI Layout Cards */
        .section-label { color: #116efc; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .main-headline { font-family: 'Lora', serif; font-size: 32px; line-height: 1.15; font-weight: 700; margin-bottom: 12px; }
        .sub-headline { font-size: 15px; color: #aaaaaa; line-height: 1.4; margin-bottom: 12px; }
        .byline { font-size: 12px; color: #777777; margin-bottom: 16px; }
        
        .media-container { margin-bottom: 16px; background-color: #1a1a1a; border-radius: 4px; overflow: hidden; }
        .featured-image, .featured-video { width: 100%; height: auto; display: block; }
        hr { border: 0; height: 1px; background: #2d2d2d; margin: 24px 0; }

        .loading-status { text-align: center; color: #666; font-size: 14px; padding: 40px 0; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <div class="nav-top">
            <a href="#" class="logo">The Ngetich Post</a>
        </div>
    </header>

    <div class="nav-sub">
        <a href="#" class="active">Top Stories</a>
        <a class="ai-option">Ngetich AI Active</a>
    </div>

    <main>
        <div id="liveNewsFeed">
            <p class="loading-status" id="loadingText">Connecting to cloud sheet database...</p>
        </div>
    </main>

    <script>
        // ⚠️ CRITICAL SETUP: Replace the string below with your real Spreadsheet ID from Step 2
        const SPREADSHEET_ID = "YOUR_SPREADSHEET_ID_HERE";
        
        // This targets Sheet 1 and reads rows automatically
        const JSON_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        window.onload = function() {
            loadArticlesFromSheets();
        };

        function loadArticlesFromSheets() {
            fetch(JSON_URL)
                .then(response => response.text())
                .then(data => {
                    // Clean up Google's secure wrapper format to parse clean JSON array
                    const pureJson = JSON.parse(data.substr(47).slice(0, -2));
                    const rows = pureJson.table.rows;
                    const feedContainer = document.getElementById('liveNewsFeed');
                    
                    if (!rows || rows.length === 0) {
                        feedContainer.innerHTML = "<p class='loading-status'>No articles found in the spreadsheet database.</p>";
                        return;
                    }

                    // Clear loading text
                    feedContainer.innerHTML = "";

                    // Loop through database rows backwards to keep newest entries on top
                    for (let i = rows.length - 1; i >= 0; i--) {
                        const cells = rows[i].c;
                        
                        // Extract spreadsheet column metrics safely
                        const category = cells[0] ? cells[0].v : "General";
                        const title = cells[1] ? cells[1].v : "";
                        const sub = cells[2] ? cells[2].v : "";
                        const mediaUrl = cells[3] ? cells[3].v : "";

                        if(!title) continue; // Skip blank rows

                        // Check if media cell holds a video asset or a picture url
                        let mediaMarkup = '';
                        if(mediaUrl) {
                            if(mediaUrl.toLowerCase().endsWith('.mp4') || mediaUrl.includes('video')) {
                                mediaMarkup = `<div class="media-container"><video src="${mediaUrl}" controls class="featured-video"></video></div>`;
                            } else {
                                mediaMarkup = `<div class="media-container"><img src="${mediaUrl}" class="featured-image"></div>`;
                            }
                        }

                        // Assemble structural post framework card
                        const postHtml = `
                            <article>
                                <span class="section-label">${category}</span>
                                <h1 class="main-headline">${title}</h1>
                                <p class="sub-headline">${sub}</p>
                                <p class="byline">Published via Cloud Feed Engine</p>
                                ${mediaMarkup}
                            </article>
                            <hr>
                        `;
                        
                        feedContainer.innerHTML += postHtml;
                    }
                })
                .catch(error => {
                    console.error("Database connection failure:", error);
                    document.getElementById('loadingText').innerText = "Database connection offline. Verify spreadsheet publishing status.";
                });
        }
    </script>
</body>
</html>
